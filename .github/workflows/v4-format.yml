name: v4-format

on:
  push:
    branches:
      - feat/logical-units-v4

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: pip install black==26.5.1
      - run: |
          black fpdf/logical_units.py fpdf/output.py test/text_shaping/test_logical_units_v4_model.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Sovichea Tep"
          git config user.email "sovichea.tep@gmail.com"
          git add fpdf/logical_units.py fpdf/output.py test/text_shaping/test_logical_units_v4_model.py
          git commit -m "style: format logical unit v4"
          git push origin HEAD:feat/logical-units-v4
